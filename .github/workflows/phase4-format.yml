name: Phase 4 Format

on:
  push:
    branches:
      - phase4-catalogue-discovery

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase4-catalogue-discovery
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Finalize Phase 4 route wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          hero = Path('src/components/home/home-hero.tsx')
          text = hero.read_text()
          text = text.replace(
              'href="/#shop"',
              'href={index === 3 ? "/categories/plants" : index === 4 ? "/categories/lighting" : "/shop"}',
          )
          text = text.replace(
              'href="/#collection"',
              'href={index === 0 ? "/collections/new-arrivals" : index === 3 ? "/collections/living-green" : index === 4 ? "/collections/warm-lighting" : "/collections/house-essentials"}',
          )
          hero.write_text(text)

          controls = Path('src/components/catalogue/catalogue-controls.tsx')
          text = controls.read_text().replace('Show {resultCount} objects', 'Apply filters')
          controls.write_text(text)

          e2e = Path('tests/e2e/catalogue.spec.ts')
          text = e2e.read_text().replace(
              'page.getByRole("button", { name: /Show 0 objects/ }).click();',
              'page.getByRole("button", { name: "Apply filters" }).click();',
          )
          e2e.write_text(text)
          PY
      - run: npm run format
      - name: Commit formatted Phase 4 tree
        run: |
          rm .github/workflows/phase4-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: finalize phase 4 implementation"
          git push origin HEAD:phase4-catalogue-discovery

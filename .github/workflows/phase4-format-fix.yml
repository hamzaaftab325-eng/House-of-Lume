name: Phase 4 Format Fix

on:
  push:
    branches:
      - phase4-catalogue-discovery

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase4-catalogue-discovery
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit exact repository formatting
        run: |
          rm .github/workflows/phase4-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: normalize phase 4 fixes"
          git push origin HEAD:phase4-catalogue-discovery

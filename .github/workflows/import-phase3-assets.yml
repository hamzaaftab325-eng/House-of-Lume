name: Import Phase 3 Assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-phase3-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download generated source assets
        env:
          HERO_B64: ""
          LIGHTING_B64: ""
          PLANTS_B64: ""
          DECOR_B64: ""
          PLANTERS_B64: ""
          FEATURED_B64: ""
          COLLECTION_B64: ""
          LIVING_B64: ""
          BEDROOM_B64: ""
          DINING_B64: ""
          WORKSPACE_B64: ""
          CONCEPT_B64: ""
        run: |
          set -euo pipefail
          mkdir -p /tmp/hol-assets public/images/house-of-lume
          fetch() { printf '%s' "$2" | base64 -d | xargs -0 curl -fL -o "/tmp/hol-assets/$1.png"; }
          fetch hero "$HERO_B64"
          fetch lighting "$LIGHTING_B64"
          fetch plants "$PLANTS_B64"
          fetch decor "$DECOR_B64"
          fetch planters "$PLANTERS_B64"
          fetch featured "$FEATURED_B64"
          fetch collection "$COLLECTION_B64"
          fetch living "$LIVING_B64"
          fetch bedroom "$BEDROOM_B64"
          fetch dining "$DINING_B64"
          fetch workspace "$WORKSPACE_B64"
          fetch concept "$CONCEPT_B64"

      - name: Optimize and crop production assets
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path('/tmp/hol-assets')
          target = Path('public/images/house-of-lume')
          target.mkdir(parents=True, exist_ok=True)
          specs = {'hero':1800,'lighting':900,'plants':900,'decor':900,'planters':900,'featured':1800,'collection':1800,'living':1200,'bedroom':1200,'dining':1200,'workspace':1200}
          for name, max_width in specs.items():
              image = Image.open(source / f'{name}.png').convert('RGB')
              if image.width > max_width:
                  image = image.resize((max_width, round(image.height * max_width / image.width)), Image.Resampling.LANCZOS)
              image.save(target / f'{name}.webp', 'WEBP', quality=78, method=6)
          concept = Image.open(source / 'concept.png').convert('RGB')
          w, h = concept.size
          craft = concept.crop((0, int(h * 0.645), int(w * 0.43), int(h * 0.775)))
          craft = craft.resize((1200, round(1200 * craft.height / craft.width)), Image.Resampling.LANCZOS)
          craft.save(target / 'craftsmanship.webp', 'WEBP', quality=80, method=6)
          PY

      - name: Commit permanent assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/house-of-lume
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: add final Phase 3 imagery"
          git push

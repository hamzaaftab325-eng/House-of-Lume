name: Format Phase 3 Temporary

on:
  push:
    branches: [phase3-homepage-final]
    paths:
      - ".github/workflows/format-phase3-temp.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format Phase 3 files
        run: npx prettier --write "src/app/(store)/page.tsx" "src/app/(store)/page.module.css" "src/components/editorial/torn-divider.tsx" "tests/e2e/foundation.spec.ts"
      - name: Commit formatting
        run: |
          git config user.name "house-of-lume-ci"
          git config user.email "actions@users.noreply.github.com"
          git add "src/app/(store)/page.tsx" "src/app/(store)/page.module.css" "src/components/editorial/torn-divider.tsx" "tests/e2e/foundation.spec.ts"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format Phase 3 homepage"
          git push

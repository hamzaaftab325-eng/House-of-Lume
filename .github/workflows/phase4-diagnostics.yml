name: Phase 4 Diagnostics

on:
  push:
    branches: [phase-4-catalogue]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture lint diagnostics
        continue-on-error: true
        shell: bash
        run: npm run lint > lint.log 2>&1

      - name: Capture TypeScript diagnostics
        continue-on-error: true
        shell: bash
        run: npm run typecheck > typecheck.log 2>&1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-diagnostics
          path: |
            lint.log
            typecheck.log

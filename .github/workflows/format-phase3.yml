name: Format Phase 3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-phase3.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format Phase 3 files
        run: npx prettier --write "src/app/(store)/page.tsx" "src/app/(store)/page.module.css" "tests/e2e/foundation.spec.ts"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/(store)/page.tsx" "src/app/(store)/page.module.css" "tests/e2e/foundation.spec.ts"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format final Phase 3 homepage"
          git push
